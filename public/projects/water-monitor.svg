<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18130E"/>
      <stop offset="50%" stop-color="#261B12"/>
      <stop offset="100%" stop-color="#140E0A"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="amberLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Top bar -->
  <rect x="40" y="30" width="1120" height="54" rx="10" fill="#2E2015" stroke="#483320" stroke-width="1.5"/>
  <circle cx="70" cy="57" r="7" fill="#EF4444"/>
  <circle cx="95" cy="57" r="7" fill="#F59E0B"/>
  <circle cx="120" cy="57" r="7" fill="#10B981"/>
  <text x="160" y="63" fill="#D5C095" font-family="system-ui, sans-serif" font-size="16" font-weight="600">AquaSense AI — Optical Contamination &amp; Telemetry Portal</text>
  <rect x="1010" y="44" width="130" height="26" rx="13" fill="#0D9488" fill-opacity="0.2" stroke="#14B8A6" stroke-width="1"/>
  <text x="1035" y="62" fill="#2DD4BF" font-family="system-ui, sans-serif" font-size="12" font-weight="600">● LIVE MONITOR</text>

  <!-- Left Camera Stream & CV Panel -->
  <rect x="40" y="105" width="620" height="380" rx="12" fill="#1E1610" stroke="#3A291A" stroke-width="1.5"/>
  <rect x="60" y="125" width="580" height="260" rx="8" fill="#110B07"/>
  <!-- Target Bounding Boxes -->
  <rect x="120" y="160" width="140" height="90" rx="4" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-dasharray="4,4"/>
  <rect x="120" y="145" width="110" height="18" fill="#2DD4BF"/>
  <text x="126" y="158" fill="#042F2E" font-family="monospace" font-size="10" font-weight="700">Particulate: 0.12mm</text>

  <rect x="340" y="210" width="180" height="120" rx="4" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <rect x="340" y="195" width="125" height="18" fill="#F59E0B"/>
  <text x="346" y="208" fill="#451A03" font-family="monospace" font-size="10" font-weight="700">Turbidity Alert: Moderate</text>

  <!-- OpenCV telemetry overlay -->
  <text x="75" y="360" fill="#9B784B" font-family="monospace" font-size="13">OpenCV Frame: 60 FPS | Model: PyTorch ResNet-UNet | Confidence: 98.4%</text>
  <text x="75" y="420" fill="#E2D3B3" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Real-time Particulate Classification</text>
  <text x="75" y="445" fill="#A8947C" font-family="system-ui, sans-serif" font-size="13">Multi-spectral optical flow edge telemetry measuring particulate density</text>

  <!-- Right Telemetry Cards -->
  <rect x="680" y="105" width="480" height="180" rx="12" fill="#1E1610" stroke="#3A291A" stroke-width="1.5"/>
  <text x="705" y="140" fill="#E2D3B3" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Purity Index &amp; pH Stream</text>
  <text x="1050" y="140" fill="#2DD4BF" font-family="monospace" font-size="15" font-weight="700">7.42 pH</text>
  <!-- Chart line -->
  <path d="M 710 230 Q 770 190, 830 215 T 950 175 T 1080 200 T 1130 180" fill="none" stroke="url(#cyanLine)" stroke-width="3"/>
  <circle cx="1130" cy="180" r="5" fill="#2DD4BF"/>

  <rect x="680" y="305" width="480" height="180" rx="12" fill="#1E1610" stroke="#3A291A" stroke-width="1.5"/>
  <text x="705" y="340" fill="#E2D3B3" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Turbidity &amp; Heavy Particulates</text>
  <text x="1050" y="340" fill="#F59E0B" font-family="monospace" font-size="15" font-weight="700">1.8 NTU</text>
  <path d="M 710 430 Q 780 440, 840 400 T 960 420 T 1070 380 T 1130 395" fill="none" stroke="url(#amberLine)" stroke-width="3"/>
  <circle cx="1130" cy="395" r="5" fill="#F59E0B"/>

  <!-- Bottom Metric Strip -->
  <rect x="40" y="505" width="360" height="135" rx="12" fill="#1E1610" stroke="#3A291A" stroke-width="1.5"/>
  <text x="65" y="540" fill="#A8947C" font-family="system-ui, sans-serif" font-size="13">Telemetry Ingestion Rate</text>
  <text x="65" y="585" fill="#E2D3B3" font-family="system-ui, sans-serif" font-size="28" font-weight="700">1,200/min</text>
  <text x="65" y="615" fill="#10B981" font-family="system-ui, sans-serif" font-size="12">↑ 100% Uptime across nodes</text>

  <rect x="420" y="505" width="360" height="135" rx="12" fill="#1E1610" stroke="#3A291A" stroke-width="1.5"/>
  <text x="445" y="540" fill="#A8947C" font-family="system-ui, sans-serif" font-size="13">ML Anomaly Detection</text>
  <text x="445" y="585" fill="#E2D3B3" font-family="system-ui, sans-serif" font-size="28" font-weight="700">0.03s Latency</text>
  <text x="445" y="615" fill="#D5C095" font-family="system-ui, sans-serif" font-size="12">PyTorch GPU Accelerated</text>

  <rect x="800" y="505" width="360" height="135" rx="12" fill="#1E1610" stroke="#3A291A" stroke-width="1.5"/>
  <text x="825" y="540" fill="#A8947C" font-family="system-ui, sans-serif" font-size="13">Automated Safety Alerts</text>
  <text x="825" y="585" fill="#E2D3B3" font-family="system-ui, sans-serif" font-size="28" font-weight="700">Zero False Alerts</text>
  <text x="825" y="615" fill="#2DD4BF" font-family="system-ui, sans-serif" font-size="12">Threshold rule triggers active</text>
</svg>
